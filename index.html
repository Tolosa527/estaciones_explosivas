<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estaciones Explosivas · Urtaroak Lehertzen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Estaciones Explosivas <small>Urtaro Lehergarriak</small></h1>
    <div id="layout">
    <section id="panel">
      <button id="start">Comenzar / Hasi</button>
      <div id="quiz" hidden>
        <p id="question"></p>
        <div id="options"></div>
        <p id="feedback" aria-live="polite"></p>
        <button id="continue" hidden>Continuar / Jarraitu</button>
      </div>
      <div id="end" hidden>
        <p id="endMsg"></p>
        <button id="restart">Jugar otra vez / Berriz jolastu</button>
      </div>
    </section>
    <div id="stage">
      <img id="kid" alt="Niño">
      <img id="balloon" alt="Globo">
      <img id="explosion" alt="Explosión" hidden>
    </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
